</main>

        { id:'ice-hb',       name:'HB Ice Cream',       price:45, desc:'Strawberry / Vanilla / Chocolate' },

const COMBO_SIDES  = ['Crispy Chips', 'Plain Jollof Rice', 'Fried Rice'];
const COMBO_DRINKS = ['Coca Cola', 'Fanta Orange', 'Sprite', 'Vimto'];

/* ════════════════════════════════════════
   SESSION MANAGEMENT
════════════════════════════════════════ */
const sessions = {};

function getSession(uid) {
    if (!sessions[uid]) resetSession(uid);
    return sessions[uid];
}

function resetSession(uid) {
    sessions[uid] = {
        step:           'WELCOME',
        cart:           [],
        pendingItem:    null,   // item being configured before cart
        currentCat:     null,
        name:           '',
        orderType:      null,   // 'delivery' | 'pickup'
        address:        '',
        deliveryFee:    null,
        pendingOrderId: null
    };
}

/* ════════════════════════════════════════
   MAIN MESSAGE ROUTER
════════════════════════════════════════ */
function routeMessage(uid, input) {
    const s   = getSession(uid);
    const raw = (input || '').trim();
    const lo  = raw.toLowerCase();

    // ── Global restarts ──
    if (['hi','hello','menu','restart','start','hey','helo','order'].includes(lo) || raw === 'START_OVER') {
        resetSession(uid);
        return mkWelcome();
    }

    switch (s.step) {
        case 'WELCOME':        return doWelcome(s, uid, raw);
        case 'CHOOSE_CAT':     return doCat(s, raw);
        case 'CHOOSE_ITEM':    return doItem(s, raw, lo);
        case 'ASK_QUANTITY':   return doQty(s, uid, raw);
        case 'COMBO_SIDE':     return doComboSide(s, raw);
        case 'COMBO_DRINK':    return doComboDrink(s, uid, raw);
        case 'CART_REVIEW':    return doCart(s, uid, raw);
        case 'ASK_ORDER_TYPE': return doOrderType(s, uid, raw);
        case 'ASK_ADDRESS':    return doAddress(s, uid, raw);
        case 'AWAITING_FEE':   return doAwaitingFee(s, uid, raw);
        case 'CONFIRM_FEE':    return doConfirmFee(s, uid, raw);
        case 'ASK_PAYMENT':    return doPayment(s, uid, raw);
        default:
            resetSession(uid);
            return mkWelcome();
    }
}

/* ── STEP: WELCOME ── */
function doWelcome(s, uid, raw) {
    if (raw === 'OPT_HYBRID_WEB') {
        return { type:'text', text:`🍗 *CHICKEN TOWN SL — VISUAL MENU*\n\nOpen our full interactive menu with photos, side choices & live stock:\n\n👉 *${RC.webAppUrl}*\n\nBrowse, customise, and place your order directly from the site! Your order goes straight to our kitchen. 🛵` };
    }
    if (raw === 'OPT_CHAT_ORDER') {
        s.step = 'CHOOSE_CAT';
        return mkCatList();
    }
    if (raw === 'OPT_CALL_DISPATCH') {
        return { type:'text', text:`📞 *CHICKEN TOWN HOTLINES*\n\n⚡ Fast Delivery Shortcode: *${RC.hotline}*\n📱 Catering / WhatsApp: *${RC.phone}*\n📍 24 Wilkinson Road, Freetown\n\nOpen daily 11:00 AM – 11:00 PM!` };
    }
    return mkWelcome();
}

/* ── STEP: CHOOSE CATEGORY ── */
function doCat(s, raw) {
    const key = raw.replace(/^CAT_/, '').toLowerCase();
    if (MENU[key]) {
        s.step      = 'CHOOSE_ITEM';
        s.currentCat = key;
        return mkItemList(key);
    }
    return mkCatList('⚠️ Please select a valid category:');
}

/* ── STEP: CHOOSE ITEM ── */
function doItem(s, raw, lo) {
    if (raw === 'BACK_CATEGORIES') {
        s.step = 'CHOOSE_CAT';
        return mkCatList();
    }

    // Find item by ID or name across all categories
    let found = null;
    for (const items of Object.values(MENU)) {
        found = items.find(i => i.id === raw || i.name.toLowerCase() === lo);
        if (found) break;
    }

    if (!found) return mkItemList(s.currentCat || 'deals', '⚠️ Item not found. Please choose from the list:');

    s.pendingItem = { ...found, qty: 1, side: null, drink: null };
    s.step = 'ASK_QUANTITY';

    return {
        type: 'interactive_buttons',
        header: `🍗 ${found.name}`,
        body: `Price: *Le ${found.price}* each\n${found.desc ? `_${found.desc}_\n` : ''}\nHow many would you like to order?`,
        buttons: [
            { id:'QTY_1', title:'× 1' },
            { id:'QTY_2', title:'× 2' },
            { id:'QTY_3', title:'× 3' }
        ],
        footer: 'Or type any number (e.g. 5, 10, 99…) and send ↑'
    };
}

/* ── STEP: QUANTITY ── */
function doQty(s, uid, raw) {
    // Accept button QTY_N or a typed number
    let qty;
    if (/^QTY_(\d+)$/.test(raw)) {
        qty = parseInt(raw.replace('QTY_', ''));
    } else {
        qty = parseInt(raw);
    }

    if (!qty || qty < 1 || qty > 999) {
        return {
            type: 'interactive_buttons',
            header: `🍗 ${s.pendingItem.name}`,
            body: `❌ *"${raw}"* is not a valid quantity.\n\nPlease choose a button or type a number between 1 and 999:`,
            buttons: [
                { id:'QTY_1', title:'× 1' },
                { id:'QTY_2', title:'× 2' },
                { id:'QTY_3', title:'× 3' }
            ],
            footer: 'Or type any number and send ↑'
        };
    }

    s.pendingItem.qty = qty;

    // Combo items need side + drink selection
    if (s.pendingItem.isCombo) {
        s.step = 'COMBO_SIDE';
        return {
            type: 'interactive_buttons',
            header: `🍗 ${s.pendingItem.name} × ${qty}`,
            body: `This combo includes a *side dish* choice.\n\nPlease select your side:`,
            buttons: COMBO_SIDES.map((sd, i) => ({ id:`SIDE_${i}`, title: sd }))
        };
    }

    // Non-combo → straight to cart
    addToCart(s);
    s.step = 'CART_REVIEW';
    return mkCartReview(s);
}

/* ── STEP: COMBO — CHOOSE SIDE ── */
function doComboSide(s, raw) {
    const idx = parseInt(raw.replace('SIDE_', ''));
    s.pendingItem.side = COMBO_SIDES[isNaN(idx) ? 0 : idx] || COMBO_SIDES[0];
    s.step = 'COMBO_DRINK';
    return {
        type: 'interactive_buttons',
        header: '🥤 Choose Your Drink (300ml)',
        body: `Side: *${s.pendingItem.side}* ✅\n\nNow pick your chilled soft drink:`,
        buttons: COMBO_DRINKS.map((d, i) => ({ id:`DRK_${i}`, title: d }))
    };
}

/* ── STEP: COMBO — CHOOSE DRINK ── */
function doComboDrink(s, uid, raw) {
    const idx = parseInt(raw.replace('DRK_', ''));
    s.pendingItem.drink = COMBO_DRINKS[isNaN(idx) ? 0 : idx] || COMBO_DRINKS[0];
    addToCart(s);
    s.step = 'CART_REVIEW';
    return mkCartReview(s);
}

/* ── STEP: CART REVIEW ── */
function doCart(s, uid, raw) {
    if (raw === 'ADD_MORE') { s.step = 'CHOOSE_CAT'; return mkCatList(); }
    if (raw === 'CHECKOUT') { s.step = 'ASK_ORDER_TYPE'; return mkOrderTypePrompt(s); }
    if (raw === 'CANCEL')   { resetSession(uid); return mkWelcome(); }
    return mkCartReview(s);
}

/* ── STEP: DELIVERY OR PICKUP? ── */
function doOrderType(s, uid, raw) {
    if (raw === 'ORDER_DELIVERY') {
        s.orderType = 'delivery';
        s.step      = 'ASK_ADDRESS';
        return {
            type: 'text',
            text: `📍 *DELIVERY ADDRESS*\n\nPlease send your *full delivery address or landmark* so we can confirm your delivery fee and dispatch a rider:\n\n_Example:_\n*18 Lumley Beach Road, near the green gate, Freetown*\n\nOr include your name:\n*Mariama Conteh, 18 Lumley Beach Road, near the green gate*`
        };
    }
    if (raw === 'ORDER_PICKUP') {
        s.orderType = 'pickup';
        s.step      = 'ASK_PAYMENT';
        return {
            type: 'interactive_buttons',
            header: '🏪 Store Pickup — 24 Wilkinson Road',
            body: `Great! Your order will be ready for pickup in *15–20 minutes* at our Wilkinson Road location.\n\nWhat is your name?\nAnd how would you like to pay?`,
            buttons: [
                { id:'PAY_ORANGE',    title:'📱 Orange Money' },
                { id:'PAY_AFRIMONEY', title:'⚡ Afrimoney' },
                { id:'PAY_CASH',      title:'💵 Cash at Counter' }
            ],
            footer: 'Walk-in name optional — just tap a payment method'
        };
    }
    return mkOrderTypePrompt(s);
}

/* ── STEP: ADDRESS (delivery) ── */
function doAddress(s, uid, raw) {
    if (!raw || raw.length < 4) {
        return { type:'text', text:`⚠️ Please send your full delivery address or landmark.\n\n_Example:_ *18 Lumley Beach Road, near the green gate*` };
    }

    // Split name, address if comma-separated
    const parts = raw.split(',');
    if (parts.length >= 2) {
        s.name    = parts[0].trim();
        s.address = parts.slice(1).join(',').trim();
    } else {
        s.name    = 'WhatsApp Customer';
        s.address = raw;
    }

    const subtotal = s.cart.reduce((acc, it) => acc + it.price * it.qty, 0);
    const orderId  = `CT-WA-${Math.floor(1000 + Math.random() * 9000)}`;
    s.pendingOrderId = orderId;
    s.step = 'AWAITING_FEE';

    // Push pending fee order to Kitchen KDS
    const pendingOrder = {
        id: orderId,
        customer: {
            name:    s.name,
            phone:   uid,
            address: s.address,
            type:    'delivery',
            notes:   'WhatsApp Order — Awaiting delivery fee quote'
        },
        items: s.cart.map(it => ({
            id:       it.id,
            name:     it.name,
            price:    it.price,
            quantity: it.qty,
            options:  (it.side || it.drink) ? `Side: ${it.side || '-'} | Drink: ${it.drink || '-'}` : null
        })),
        subtotal,
        deliveryFee: null,
        total:       subtotal,
        currency:    'NLe',
        paymentMethod: 'Pending Quote',
        paymentStatus: 'pending',
        status:      'awaiting_fee',
        timestamp:   new Date().toISOString()
    };

    saveOrderToKds(pendingOrder);

    return {
        type: 'interactive_buttons',
        header: '🛵 Checking Delivery Fee...',
        body: `📍 *Location Received:*\n"${s.address}"\n\n💬 _"Let me check the delivery fee for your location with our cashier at 24 Wilkinson Road..."_\n\n⏳ Please hold on for a moment while the cashier calculates the delivery fee!`,
        buttons: [
            { id:'CHECK_FEE_STATUS', title:'🔄 Check Fee Status' },
            { id:'CANCEL_ORDER',     title:'❌ Cancel Order' }
        ],
        footer: 'The cashier on the KDS board will quote your delivery fee shortly'
    };
}

/* ── STEP: WAITING FOR CASHIER QUOTE ── */
function doAwaitingFee(s, uid, raw) {
    if (raw === 'CANCEL_ORDER' || raw.toLowerCase() === 'cancel') {
        cancelPendingOrder(s.pendingOrderId);
        resetSession(uid);
        return { type:'text', text:`❌ Your delivery request has been cancelled.\n\nSend *Hi* or *Menu* whenever you want to order again!` };
    }

    // Check if cashier has quoted fee
    const orders = JSON.parse(localStorage.getItem('ct_orders') || '[]');
    const currentOrder = orders.find(o => o.id === s.pendingOrderId);
    if (currentOrder && (currentOrder.status === 'fee_quoted' || currentOrder.deliveryFee !== null)) {
        s.deliveryFee = currentOrder.deliveryFee;
        s.step = 'CONFIRM_FEE';
        return mkFeeQuotePrompt(s, currentOrder.deliveryFee);
    }

    return {
        type: 'interactive_buttons',
        header: '⏳ Still Checking with Cashier...',
        body: `Our cashier is calculating the delivery fee for:\n📍 *${s.address}*\n\nFood Subtotal: *Le ${s.cart.reduce((a, it) => a + it.price * it.qty, 0)}*\n\nYou will get an alert as soon as the cashier enters the amount!`,
        buttons: [
            { id:'CHECK_FEE_STATUS', title:'🔄 Refresh Status' },
            { id:'CANCEL_ORDER',     title:'❌ Cancel Order' }
        ]
    };
}

/* ── STEP: CUSTOMER CONFIRMS OR DECLINES QUOTED FEE ── */
function doConfirmFee(s, uid, raw) {
    if (raw === 'FEE_ACCEPT' || raw.toLowerCase() === 'yes') {
        s.step = 'ASK_PAYMENT';
        const subtotal = s.cart.reduce((a, it) => a + it.price * it.qty, 0);
        const total = subtotal + (s.deliveryFee || 0);
        return {
            type: 'interactive_buttons',
            header: `💳 Total to Pay: Le ${total}`,
            body: `Order confirmed for delivery to:\n📍 *${s.address}*\n\nHow would you like to pay?`,
            buttons: [
                { id:'PAY_ORANGE',    title:'📱 Orange Money' },
                { id:'PAY_AFRIMONEY', title:'⚡ Afrimoney' },
                { id:'PAY_CASH',      title:'💵 Cash on Delivery' }
            ]
        };
    }

    if (raw === 'FEE_CANCEL' || raw === 'CANCEL_ORDER' || raw.toLowerCase() === 'no') {
        cancelPendingOrder(s.pendingOrderId);
        resetSession(uid);
        return { type:'text', text:`❌ Order cancelled.\n\nSend *Hi* or *Menu* whenever you want to order again!` };
    }

    return mkFeeQuotePrompt(s, s.deliveryFee || 0);
}

function mkFeeQuotePrompt(s, fee) {
    const subtotal = s.cart.reduce((a, it) => a + it.price * it.qty, 0);
    const total = subtotal + fee;
    return {
        type: 'interactive_buttons',
        header: '🛵 Delivery Fee Confirmed!',
        body: `Our cashier checked your location:\n📍 *${s.address}*\n\n• Food Subtotal: *Le ${subtotal}*\n• Delivery Fee: *Le ${fee}*\n• 💰 *Grand Total: Le ${total}*\n\nWould you like to confirm this order?`,
        buttons: [
            { id:'FEE_ACCEPT', title:'✅ Yes, Confirm Order' },
            { id:'FEE_CANCEL', title:'❌ Cancel Order' }
        ]
    };
}

function cancelPendingOrder(orderId) {
    if (!orderId) return;
    try {
        const orders = JSON.parse(localStorage.getItem('ct_orders') || '[]');
        const found = orders.find(o => o.id === orderId);
        if (found) {
            found.status = 'cancelled';
            localStorage.setItem('ct_orders', JSON.stringify(orders));
            window.dispatchEvent(new StorageEvent('storage', { key:'ct_orders' }));
        }
    } catch(e) {}
}

/* ── STEP: PAYMENT → CONFIRM ── */
function doPayment(s, uid, raw) {
    const payMap = {
        PAY_ORANGE:    'Orange Money',
        PAY_AFRIMONEY: 'Afrimoney',
        PAY_CASH:      s.orderType === 'pickup' ? 'Cash at Counter' : 'Cash on Delivery'
    };
    const payMethod = payMap[raw];
    if (!payMethod) return {
        type: 'interactive_buttons',
        header: '💳 Choose Payment Method',
        body: `Please select a valid payment option:`,
        buttons: [
            { id:'PAY_ORANGE',    title:'📱 Orange Money' },
            { id:'PAY_AFRIMONEY', title:'⚡ Afrimoney' },
            { id:'PAY_CASH',      title: s.orderType === 'pickup' ? '💵 Cash at Counter' : '💵 Cash on Delivery' }
        ]
    };

    const subtotal = s.cart.reduce((acc, it) => acc + it.price * it.qty, 0);
    const fee = s.orderType === 'pickup' ? 0 : (s.deliveryFee !== null ? s.deliveryFee : 15);
    const total = subtotal + fee;
    const orderId = s.pendingOrderId || `CT-WA-${Math.floor(1000 + Math.random() * 9000)}`;

    const orders = JSON.parse(localStorage.getItem('ct_orders') || '[]');
    let orderRecord = orders.find(o => o.id === orderId);

    if (orderRecord) {
        orderRecord.status = 'received';
        orderRecord.deliveryFee = fee;
        orderRecord.total = total;
        orderRecord.paymentMethod = payMethod;
        orderRecord.paymentStatus = payMethod.includes('Cash') ? 'pending' : 'paid';
        orderRecord.timestamp = new Date().toISOString();
        orderRecord.customer.notes = 'WhatsApp Order Confirmed ✅';
    } else {
        orderRecord = {
            id: orderId,
            customer: {
                name:    s.name || (s.orderType === 'pickup' ? 'Walk-In Customer' : 'WhatsApp Customer'),
                phone:   uid,
                address: s.orderType === 'pickup' ? 'Store Pickup — 24 Wilkinson Road' : s.address,
                type:    s.orderType,
                notes:   'Ordered via WhatsApp Bot 🤖'
            },
            items: s.cart.map(it => ({
                id:       it.id,
                name:     it.name,
                price:    it.price,
                quantity: it.qty,
                options:  (it.side || it.drink) ? `Side: ${it.side || '-'} | Drink: ${it.drink || '-'}` : null
            })),
            subtotal,
            deliveryFee: fee,
            total,
            currency:    'NLe',
            paymentMethod:  payMethod,
            paymentStatus:  payMethod.includes('Cash') ? 'pending' : 'paid',
            status:         'received',
            timestamp:      new Date().toISOString()
        };
        orders.unshift(orderRecord);
    }

    localStorage.setItem('ct_orders', JSON.stringify(orders));
    window.dispatchEvent(new StorageEvent('storage', { key:'ct_orders' }));

    const receipt = buildReceipt(orderRecord, s.orderType);
    resetSession(uid);

    return {
        type:        'order_confirmed',
        orderData:   orderRecord,
        receiptText: receipt
    };
}

/* ════════════════════════════════════════
   HELPERS — ADD TO CART
════════════════════════════════════════ */
function addToCart(s) {
    // Check if same item+options already in cart → merge qty
    const existing = s.cart.find(i =>
        i.id === s.pendingItem.id &&
        i.side  === s.pendingItem.side &&
        i.drink === s.pendingItem.drink
    );
    if (existing) {
        existing.qty += s.pendingItem.qty;
    } else {
        s.cart.push({ ...s.pendingItem });
    }
    s.pendingItem = null;
}

function buildReceipt(o, orderType) {
    let t  = `🎉 *ORDER CONFIRMED!*  (#${o.id})\n\n`;
    t += `Thank you${o.customer.name !== 'WhatsApp Customer' ? `, *${o.customer.name}*` : ''}! Your order has been sent to our kitchen.\n\n`;
    t += `📦 *Order Items:*\n`;
    o.items.forEach(it => {
        t += `• ${it.quantity}× ${it.name}  — Le ${it.price * it.quantity}`;
        if (it.quantity > 1) t += ` (Le ${it.price} each)`;
        t += '\n';
        if (it.options) t += `   ↳ ${it.options}\n`;
    });
    t += `\n💰 *Food Subtotal:* Le ${o.subtotal}\n`;

    if (orderType === 'delivery') {
        t += `🛵 *Delivery Fee:* Le ${o.deliveryFee || 0} (Confirmed by cashier)\n`;
        t += `💵 *Grand Total:* *Le ${o.total}*\n`;
        t += `📍 *Deliver to:* ${o.customer.address}\n`;
        t += `⏱️ *ETA:* 30–45 minutes\n`;
    } else {
        t += `💵 *Total to Pay:* *Le ${o.total}*\n`;
        t += `🏪 *Pickup at:* 24 Wilkinson Road, Freetown\n`;
        t += `⏱️ *Ready in:* 15–20 minutes\n`;
    }

    t += `💳 *Payment:* ${o.paymentMethod}\n`;
    t += `\n📞 Need help? Call *${RC.hotline}* or *${RC.phone}*\n`;
    t += `\n🍗 *SWIT U MOT SWIT U LYF!*`;
    return t;
}

/* ════════════════════════════════════════
   KDS SYNC
════════════════════════════════════════ */
function saveOrderToKds(order) {
    try {
        const existing = JSON.parse(localStorage.getItem('ct_orders') || '[]');
        existing.unshift(order);
        localStorage.setItem('ct_orders', JSON.stringify(existing));
        // Notify other open tabs (KDS listens to storage events)
        window.dispatchEvent(new StorageEvent('storage', { key:'ct_orders' }));
    } catch (e) {
        console.error('[CT Bot] KDS sync failed:', e);
    }
}

/* ════════════════════════════════════════
   SIMULATOR UI
════════════════════════════════════════ */
const SIM_UID       = '+23278112233';
const chatContainer = document.getElementById('chatMessages');
const waInput       = document.getElementById('waInput');

function timeNow() {
    return new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
}

function playPop() {
    try {
        const ctx  = new (window.AudioContext || window.webkitAudioContext)();
        const osc  = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.12);
    } catch(_) {}
}

function esc(s)   { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;'); }
function fmtWa(s) { return (s||'').replace(/\*(.*?)\*/g,'<strong>$1</strong>').replace(/_(.*?)_/g,'<em>$1</em>').replace(/\n/g,'<br>'); }

function appendUserBubble(text) {
    const d = document.createElement('div');
    d.className = 'flex justify-end';
    d.innerHTML = `<div class="bubble-out p-3 max-w-[80%] shadow-sm text-stone-900">
        <div class="text-xs leading-relaxed whitespace-pre-wrap">${esc(text)}</div>
        <div class="text-[9px] text-stone-400 text-right mt-1 flex items-center justify-end gap-1">
            <span>${timeNow()}</span>
            <svg class="w-3 h-3 text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7M9 17l4 4L21 7"/>
            </svg>
        </div>
    </div>`;
    chatContainer.appendChild(d);
    chatContainer.scrollTop = chatContainer.scrollHeight;
}

function appendBotBubble(payload) {
    playPop();
    const d = document.createElement('div');
    d.className = 'flex justify-start';
    let inner = '';

    if (payload.type === 'text') {
        inner = `<div class="text-xs leading-relaxed">${fmtWa(payload.text)}</div>`;
    }

    if (payload.type === 'interactive_buttons') {
        inner = `
            ${payload.header ? `<div class="font-extrabold text-sm text-stone-900 mb-2">${esc(payload.header)}</div>` : ''}
            <div class="text-xs text-stone-800 leading-relaxed mb-3">${fmtWa(payload.body)}</div>
            <div class="space-y-1.5 pt-2 border-t border-stone-200">
                ${payload.buttons.map(b => `
                    <button onclick="botTrigger('${esc(b.id)}','${esc(b.title)}')"
                        class="w-full py-2 px-3 bg-white hover:bg-emerald-50 text-emerald-800 border border-stone-300 rounded-xl text-xs font-bold text-center transition active:scale-95">
                        ${esc(b.title)}
                    </button>`).join('')}
            </div>
            ${payload.footer ? `<div class="text-[10px] text-stone-400 text-center mt-2 italic">${esc(payload.footer)}</div>` : ''}`;
    }

    if (payload.type === 'interactive_list') {
        inner = `
            ${payload.header ? `<div class="font-extrabold text-sm text-stone-900 mb-2">${esc(payload.header)}</div>` : ''}
            <div class="text-xs text-stone-800 leading-relaxed mb-2">${fmtWa(payload.body)}</div>
            <div class="space-y-1.5 pt-2 border-t border-stone-200 max-h-60 overflow-y-auto">
                ${payload.sections.map(sec => `
                    <div class="text-[10px] uppercase font-bold text-stone-400 tracking-wider pt-1">${esc(sec.title)}</div>
                    ${sec.rows.map(r => `
                        <button onclick="botTrigger('${esc(r.id)}','${esc(r.title)}')"
                            class="w-full text-left p-2.5 bg-stone-50 hover:bg-emerald-50 border border-stone-200 hover:border-emerald-400 rounded-xl transition active:scale-95">
                            <div class="font-bold text-xs text-stone-900">${esc(r.title)}</div>
                            ${r.description ? `<div class="text-[10px] text-stone-500 mt-0.5">${esc(r.description)}</div>` : ''}
                        </button>`).join('')}
                `).join('')}
            </div>`;
    }

    if (payload.type === 'order_confirmed') {
        inner = `<div class="text-xs leading-relaxed">${fmtWa(payload.receiptText)}</div>`;
        saveOrderToKds(payload.orderData);
    }

    d.innerHTML = `<div class="bubble-in p-3.5 max-w-[90%] shadow-sm text-stone-900">
        ${inner}
        <div class="text-[9px] text-stone-400 text-right mt-1.5">${timeNow()}</div>
    </div>`;
    chatContainer.appendChild(d);
    chatContainer.scrollTop = chatContainer.scrollHeight;
    if (window.lucide) window.lucide.createIcons();
}

/* ── Public functions (called by onclick attributes) ── */
function botDispatch(uid, inputId, displayText) {
    if (displayText) appendUserBubble(displayText);
    setTimeout(() => appendBotBubble(routeMessage(uid, inputId)), 420);
}

function botTrigger(id, label) { botDispatch(SIM_UID, id, label || id); }
function botSendText(text)      { botDispatch(SIM_UID, text, text); }
function botSubmitInput()       {
    const v = waInput.value.trim();
    if (!v) return;
    waInput.value = '';
    botSendText(v);
}
function botReset() {
    chatContainer.innerHTML = '';
    resetSession(SIM_UID);
    setTimeout(() => appendBotBubble(routeMessage(SIM_UID, 'Hi')), 300);
}

// ── Real-Time Kitchen / Cashier Quote Listener ──
function checkIncomingFeeQuote() {
    const s = getSession(SIM_UID);
    if (s.step === 'AWAITING_FEE' && s.pendingOrderId) {
        const orders = JSON.parse(localStorage.getItem('ct_orders') || '[]');
        const current = orders.find(o => o.id === s.pendingOrderId);
        if (current && (current.status === 'fee_quoted' || (current.deliveryFee !== null && current.deliveryFee !== undefined))) {
            s.deliveryFee = current.deliveryFee;
            s.step = 'CONFIRM_FEE';
            appendBotBubble(mkFeeQuotePrompt(s, current.deliveryFee));
        }
    }
}

window.addEventListener('storage', (e) => {
    if (e.key === 'ct_fee_quote_event' || e.key === 'ct_orders') {
        checkIncomingFeeQuote();
    }
});

// Periodic cross-tab check in case storage events are throttled
setInterval(checkIncomingFeeQuote, 1000);

// Quick helper to simulate Cashier Quoting from the simulator button
window.simulateCashierQuote = function(feeAmount = 25) {
    const s = getSession(SIM_UID);
    if (!s.pendingOrderId || s.step !== 'AWAITING_FEE') {
        alert('Please proceed to checkout and enter your delivery location first so the bot enters "Checking Delivery Fee" status!');
        return;
    }
    const orders = JSON.parse(localStorage.getItem('ct_orders') || '[]');
    const current = orders.find(o => o.id === s.pendingOrderId);
    if (current) {
        current.deliveryFee = feeAmount;
        current.total = current.subtotal + feeAmount;
        current.status = 'fee_quoted';
        localStorage.setItem('ct_orders', JSON.stringify(orders));
        window.dispatchEvent(new StorageEvent('storage', { key: 'ct_orders' }));
    }
    checkIncomingFeeQuote();
};

waInput.addEventListener('keydown', e => { if (e.key === 'Enter') botSubmitInput(); });

// Auto-start
setTimeout(() => appendBotBubble(routeMessage(SIM_UID, 'Hi')), 300);
</script>
